<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quantify Mobile App — 可交互原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../tokens.css"/>
  <style>
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(1200px 800px at 50% 30%, #25223A 0%, #0F0D1E 60%, #07061A 100%);
      font-family: "Inter","Noto Sans SC",system-ui,sans-serif;
      -webkit-font-smoothing: antialiased; color: #fff;
      overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    .stage {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      gap: 56px; padding: 40px;
    }
    .legend {
      max-width: 320px;
    }
    .legend h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 12px; }
    .legend p  { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.7); margin: 0 0 18px; }
    .legend .tip {
      padding: 14px 16px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 12px;
      font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.8);
    }
    .legend .tip b { color: #fff; }
    .legend .key {
      display: inline-block; padding: 1px 7px; border-radius: 5px;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.10);
      font-family: "JetBrains Mono", monospace; font-size: 11px; margin: 0 2px;
    }
    [data-board] *::-webkit-scrollbar { width: 0; height: 0; }
    [data-board] * { scrollbar-width: none; }
    /* device shadow */
    .device-wrap {
      position: relative;
      filter: drop-shadow(0 60px 100px rgba(0,0,0,0.55));
    }
    .device {
      width: 402px; height: 874px;
      border-radius: 48px; overflow: hidden; position: relative;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 0 2px rgba(255,255,255,0.06);
    }
    .device .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; border-radius: 24px; background: #000;
      z-index: 100; pointer-events: none;
    }
    .device .home {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 139px; height: 5px; border-radius: 3px;
      background: rgba(0,0,0,0.32); z-index: 100; pointer-events: none;
    }
    .device[data-theme="dark"] .home { background: rgba(255,255,255,0.7); }
    .reset {
      position: absolute; left: 50%; bottom: -60px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
      color: #fff; font-size: 12px; backdrop-filter: blur(10px);
    }
    .reset:hover { background: rgba(255,255,255,0.16); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10);
      font-size: 11px; color: rgba(255,255,255,0.7); margin-right: 6px;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 3px; background: #16C783; }
    @media (max-width: 900px) {
      .stage { flex-direction: column; gap: 24px; padding: 24px 16px; }
      .legend { max-width: none; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="m-shell.jsx"></script>
  <script type="text/babel" src="m-screens-1.jsx"></script>
  <script type="text/babel" src="m-screens-2.jsx"></script>
  <script type="text/babel" src="m-screens-3.jsx"></script>
  <script type="text/babel" src="m-screens-4.jsx"></script>
  <script type="text/babel" src="m-screens-5.jsx"></script>
  <script type="text/babel" src="proto.jsx"></script>
</body>
</html>
