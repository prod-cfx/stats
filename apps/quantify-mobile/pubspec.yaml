name: quantify_mobile
description: "Quantify mobile app (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  logger: ^2.5.0
  k_chart_plus: ^1.0.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

# intl 0.20.2 由 flutter_localizations SDK pin；k_chart_plus 1.0.4 老约束 ^0.19，
# override 强制对齐 SDK 版本，避免 k_chart_plus 阻塞 i18n。
dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true
  generate: true
