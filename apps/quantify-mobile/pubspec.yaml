name: quantify_mobile
description: "Quantify mobile app (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  logger: ^2.5.0
  k_chart_plus: ^1.0.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# intl 0.20.2 由 flutter_localizations SDK pin；k_chart_plus 1.0.4 老约束 ^0.19，
# override 强制对齐 SDK 版本，避免 k_chart_plus 阻塞 i18n。
dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Brand assets generation; run `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create` in an env with Android/iOS SDK.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F17"
  # 前景层用透明底 logo，避免 Android 13+ Themed Icons 提取单色版时
  # 整块实心覆盖；splash_logo.png 已是 512×512 透明底，复用即可。
  adaptive_icon_foreground: "assets/branding/splash_logo.png"

flutter_native_splash:
  color: "#0B0F17"
  image: "assets/branding/splash_logo.png"
  background_image: "assets/branding/splash_background.png"
  android: true
  ios: true
  android_12:
    color: "#0B0F17"
    image: "assets/branding/splash_logo.png"
