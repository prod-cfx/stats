name: quantify-mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/quantify-mobile/**'
      - '.github/workflows/quantify-mobile.yml'
  pull_request:
    paths:
      - 'apps/quantify-mobile/**'
      - '.github/workflows/quantify-mobile.yml'

concurrency:
  group: quantify-mobile-${{ github.ref }}
  cancel-in-progress: true

# Flutter 版本与 apps/quantify-mobile/pubspec.yaml `environment.sdk: ^3.11.5`
# (Dart) 对齐：Flutter 3.41.9 自带 Dart 3.11.5（本地开发同版本）。
env:
  FLUTTER_VERSION: '3.41.9'
  FLUTTER_CHANNEL: 'stable'
  APP_DIR: apps/quantify-mobile

jobs:
  analyze-test:
    name: analyze + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'
          pub-cache-key: 'pub-:os:-:hash:'

      # ~/.pub-cache 由 subosito/flutter-action 的 pub-cache-key 接管，
      # 这里只补 .dart_tool（action 不缓存它）。
      - name: Cache .dart_tool
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('apps/quantify-mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (fatal-warnings)
        run: flutter analyze --fatal-warnings

      - name: flutter test
        run: flutter test --no-pub

  android-build:
    name: build apk debug (ubuntu)
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'
          pub-cache-key: 'pub-:os:-:hash:'

      # ~/.pub-cache 由 subosito/flutter-action 的 pub-cache-key 接管，
      # 这里只补 .dart_tool（action 不缓存它）。
      - name: Cache .dart_tool
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('apps/quantify-mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.APP_DIR }}/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/quantify-mobile/android/**/*.gradle*', 'apps/quantify-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --debug --no-shrink
        run: flutter build apk --debug --no-shrink

  ios-build:
    name: build ios debug --no-codesign (macos)
    runs-on: macos-latest
    needs: analyze-test
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'
          pub-cache-key: 'pub-:os:-:hash:'

      # ~/.pub-cache 由 subosito/flutter-action 的 pub-cache-key 接管，
      # 这里只补 .dart_tool（action 不缓存它）。
      - name: Cache .dart_tool
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('apps/quantify-mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/quantify-mobile/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios --debug --no-codesign
        run: flutter build ios --debug --no-codesign
