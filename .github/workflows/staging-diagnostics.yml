name: Staging Diagnostics

on:
  workflow_dispatch:

jobs:
  quantify-lock:
    runs-on: ubuntu-latest
    steps:
      - name: 加载 SSH 私钥
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

      - name: 查看 quantify 部署锁与进程
        env:
          HOST: ${{ secrets.AWS_SSH_HOST }}
          PORT: ${{ secrets.AWS_SSH_PORT }}
          USER: ${{ secrets.AWS_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -p "$PORT" "$USER@$HOST" "bash -s" <<'REMOTE'
          set -euo pipefail

          APP_ROOT="/opt/work/quantify"
          LOCK_FILE="$APP_ROOT/.deploy.lock"

          echo "[INFO] now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "[INFO] host=$(hostname) user=$(id -un)"
          echo "[INFO] lock_file=$LOCK_FILE"

          ls -ld "$APP_ROOT" "$APP_ROOT/releases" "$APP_ROOT/shared" "$APP_ROOT/uploads" 2>&1 || true
          ls -l "$LOCK_FILE" 2>&1 || true

          if flock -n "$LOCK_FILE" true; then
            echo "[INFO] quantify deploy lock is free"
          else
            echo "[WARN] quantify deploy lock is held"
          fi

          if command -v fuser >/dev/null 2>&1; then
            echo "[INFO] fuser:"
            fuser -v "$LOCK_FILE" || true
          fi

          echo "[INFO] deploy/prisma/pnpm/ssh process list:"
          ps -eo pid,ppid,stat,etime,cmd \
            | grep -E 'prisma|migrate|pnpm|dx|ssh.*bash -s|deploy|node' \
            | grep -v grep \
            || true

          echo "[INFO] pm2 list:"
          pm2 list || true
          echo "[INFO] pm2 jlist summary:"
          pm2 jlist 2>/dev/null | node -e '
            let s = ""
            process.stdin.on("data", d => s += d)
            process.stdin.on("end", () => {
              const apps = JSON.parse(s || "[]")
              console.log(JSON.stringify(apps.map(app => ({
                name: app.name,
                status: app.pm2_env?.status,
                pid: app.pid,
                restart_time: app.pm2_env?.restart_time,
                unstable_restarts: app.pm2_env?.unstable_restarts,
                cwd: app.pm2_env?.pm_cwd,
                out: app.pm2_env?.pm_out_log_path,
                err: app.pm2_env?.pm_err_log_path,
              })), null, 2))
            })
          ' || true

          echo "[INFO] local quantify health/template curl:"
          curl -sS -m 5 -w '\nhttp=%{http_code}\n' http://127.0.0.1:3010/api/v1/health 2>&1 | tail -c 4000 || true
          curl -sS -m 5 -w '\nhttp=%{http_code}\n' http://127.0.0.1:3010/api/v1/strategy-plaza/templates 2>&1 | tail -c 4000 || true

          echo "[INFO] recent quantify logs:"
          for log in "$HOME/.pm2/logs/quantify-api-error.log" "$HOME/.pm2/logs/quantify-api-out.log" "$HOME/.pm2/logs/quantify-backtest-worker-error.log" "$HOME/.pm2/logs/quantify-backtest-worker-out.log"; do
            echo "[INFO] log=$log"
            tail -n 160 "$log" 2>&1 || true
          done

          CURRENT_DIR="$(readlink "$APP_ROOT/current" 2>/dev/null || true)"
          echo "[INFO] current=${CURRENT_DIR:-missing}"
          if [ -n "$CURRENT_DIR" ]; then
            echo "[INFO] current package:"
            node -e "const p=require('$APP_ROOT/current/package.json'); console.log(JSON.stringify({name:p.name,version:p.version}, null, 2))" 2>/dev/null || true
          fi

          latest_release="$(ls -td "$APP_ROOT"/releases/* 2>/dev/null | head -n 1 || true)"
          echo "[INFO] latest_release=${latest_release:-missing}"

          if [ -n "$latest_release" ] && command -v pnpm >/dev/null 2>&1; then
            cd "$latest_release"
            if [ -f .env.staging ] || [ -f .env.staging.local ]; then
              echo "[INFO] prisma migrate status:"
              pnpm exec dotenv -e .env.staging -e .env.staging.local -- bash -lc '
                set -euo pipefail
                if [ -n "${QUANTIFY_DATABASE_URL:-}" ] && [ "${QUANTIFY_DATABASE_URL}" != "__SET_IN_env.local__" ]; then
                  export DATABASE_URL="$QUANTIFY_DATABASE_URL"
                fi
                pnpm --filter @net/quantify exec prisma migrate status --schema apps/quantify/prisma/schema 2>&1 || true
              '
            fi
          fi
          REMOTE
