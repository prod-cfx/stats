packages:
  - apps/*
  - packages/*
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@babel/core'
  - '@esbuild/aix-ppc64'
  - '@esbuild/android-arm'
  - '@esbuild/android-arm64'
  - '@esbuild/android-x64'
  - '@esbuild/darwin-arm64'
  - '@esbuild/darwin-x64'
  - '@esbuild/freebsd-arm64'
  - '@esbuild/freebsd-x64'
  - '@esbuild/linux-arm'
  - '@esbuild/linux-arm64'
  - '@esbuild/linux-ia32'
  - '@esbuild/linux-loong64'
  - '@esbuild/linux-mips64el'
  - '@esbuild/linux-ppc64'
  - '@esbuild/linux-riscv64'
  - '@esbuild/linux-s390x'
  - '@esbuild/linux-x64'
  - '@esbuild/netbsd-arm64'
  - '@esbuild/netbsd-x64'
  - '@esbuild/openbsd-arm64'
  - '@esbuild/openbsd-x64'
  - '@esbuild/openharmony-arm64'
  - '@esbuild/sunos-x64'
  - '@esbuild/win32-arm64'
  - '@esbuild/win32-ia32'
  - '@esbuild/win32-x64'
  - dompurify
  - esbuild
  - form-data
  - js-yaml
  - launch-editor
  - shell-quote
  - ws
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver
  - semver@5.7.2
  - semver@6.3.1
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@openapitools/openapi-generator-cli'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - bcrypt
  - bufferutil
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
  - utf-8-validate
